# ===== Настройки админки (Sveltia CMS) =====
# Админка: https://zzzx07180-cyber.github.io/klushki-russia/admin/
# Каждый товар — отдельный файл data/products/<номер>.json. После «Сохранить» админка сама
# записывает изменения на GitHub, а GitHub за 1–2 минуты собирает каталог и обновляет сайт
# (.github/workflows/publish.yml → tools/build_products.py).
# ⚠️ Поменял поля здесь — проверь, что tools/build_products.py понимает их так же.
# Репозиторий ПУБЛИЧНЫЙ: всё, что вводится в админке, видно любому. Закупочные цены,
# поставщиков и пометки «для себя» сюда НЕ вписывать.

backend:
  name: github
  repo: zzzx07180-cyber/klushki-russia
  branch: main
  # Вход только по токену (ключу) GitHub: для кнопки «Войти через GitHub» нужен свой сервер
  # авторизации, которого у нас нет. Как сделать токен — в CLAUDE.md, раздел «Админка».
  auth_methods: [token]
  commit_messages:
    create: "Админка: новый товар {{slug}}"
    update: "Админка: изменён товар {{slug}}"
    delete: "Админка: удалён товар {{slug}}"
    uploadMedia: "Админка: загружено фото {{path}}"
    deleteMedia: "Админка: удалено фото {{path}}"

app_title: КЛЮШКИ RUSSIA — админка
logo:
  src: ../images/logo.png
site_url: https://zzzx07180-cyber.github.io/klushki-russia/

# Фото товаров. Админка сама уменьшает их до 1600 точек и переводит в WebP
# (снимок с телефона ~5 МБ → ~200–300 КБ), чтобы каталог быстро открывался на телефоне.
media_folder: /images/products
public_folder: /images/products
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Пустые необязательные поля в файл не записываем — файлы товаров остаются короткими
output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

collections:
  - name: products
    label: Товары
    label_singular: товар
    description: Всё, что есть в каталоге сайта. Изменения появляются на сайте через 1–2 минуты после сохранения.
    folder: data/products
    format: json
    extension: json
    create: true
    delete: true
    # Номер нового товара на сайте — дата и время создания (product.html?id=20261117153045):
    # никогда не повторяется. Номера перенесённых из таблицы товаров (1001…, 3001…) не меняются.
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: brand
    summary: "{{brand}} {{name}}"
    preview_path: "product.html?id={{slug}}"
    editor:
      preview: false
    sortable_fields: [brand, price]
    view_filters:
      - { label: "Клюшки", field: category, pattern: sticks }
      - { label: "Клюшки: восстановленные", field: stick.type, pattern: restored }
      - { label: "Клюшки: оригинальные", field: stick.type, pattern: original }
      - { label: "Коньки", field: category, pattern: skates }
      - { label: "Налокотники", field: category, pattern: elbows }
      - { label: "Краги", field: category, pattern: gloves }
      - { label: "Шлемы", field: category, pattern: helmets }
      - { label: "Нет в наличии", field: inStock, pattern: false }
    fields:
      - name: category
        label: Раздел
        widget: select
        default: sticks
        options:
          - { label: "Клюшки", value: sticks }
          - { label: "Коньки", value: skates }
          - { label: "Налокотники", value: elbows }
          - { label: "Краги", value: gloves }
          - { label: "Шлемы", value: helmets }

      - name: brand
        label: Бренд
        widget: string
        hint: "Например: Bauer, CCM, Warrior. Пишите одинаково — по бренду работает фильтр в каталоге."

      - name: name
        label: Модель
        widget: string
        required: false
        hint: "Например: Vapor Hyperlite. Можно оставить пустым — на сайте будет «Клюшка», «Краги» и т.п."

      - name: price
        label: Цена, ₽
        widget: number
        value_type: int
        min: 0
        required: false
        hint: "Только число, без пробелов и ₽. Пусто — на сайте «Цена по запросу»."

      - name: inStock
        label: В наличии
        widget: boolean
        default: true
        hint: "Выключите, если товар продан: он останется на сайте с кнопкой «Узнать о поступлении»."

      - name: photos
        label: Фото
        widget: image
        multiple: true
        max: 12
        required: false
        hint: "Первое фото — главное, его видно в каталоге. Можно снимать прямо с телефона."

      - name: stick
        label: Только для клюшек
        widget: object
        hint: "У других товаров (краги, налокотники…) эти поля можно не трогать — на сайт они не попадут."
        fields:
          - name: type
            label: Тип
            widget: select
            required: false
            default: restored
            options:
              - { label: "Восстановленная", value: restored }
              - { label: "Оригинальная", value: original }
          - name: repair
            label: Место перелома
            widget: select
            required: false
            hint: "Только для восстановленных. Не выбрано — «труба»."
            options:
              - { label: "Труба", value: shaft }
              - { label: "Перо", value: blade }
          - name: repairNote
            label: О ремонте подробнее
            widget: text
            required: false
            hint: "Необязательно. Видно на странице товара в блоке «О ремонте»."
          - name: hand
            label: Хват
            widget: select
            required: false
            options: ["Левый", "Правый"]
          - name: curve
            label: Загиб
            widget: string
            required: false
            hint: "Например: P92, P28, P29 (можно просто 92)."
          - name: flex
            label: Жёсткость
            widget: number
            value_type: int
            required: false
            hint: "Например: 75, 85."
          - name: goalie
            label: Вратарская
            widget: boolean
            required: false
            default: false
          - name: paddle
            label: Длина пера (у вратарских)
            widget: string
            required: false
            hint: "Например: 26."

      - name: size
        label: Размер
        widget: string
        required: false
        hint: "Для крагов, налокотников, шлемов, коньков. Например: 13, M, 42."

      - name: sku
        label: Ваш номер товара
        widget: string
        required: false
        hint: "Как в таблице или на бирке. Показывается на странице товара: «№12»."

      - name: description
        label: Описание
        widget: text
        required: false

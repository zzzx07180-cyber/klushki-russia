<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090d">  <!-- цвет панели браузера — как у шапки -->
  <title>Каталог — КЛЮШКИ RUSSIA</title>
  <meta name="description" content="Каталог хоккейной экипировки: клюшки (оригиналы и восстановленные), коньки, шлемы, налокотники. Доставка СДЭК и Почтой России.">
  <!-- Значок сайта и превью ссылки в Telegram / ВКонтакте (картинки делает tools/make_icons.py).
       Превью не видит скрипты страницы, поэтому у товара — общий текст, а не название клюшки. -->
  <link rel="icon" type="image/png" href="images/favicon.png?v=20261119-1106">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=20261119-1106">
  <!-- Подпись под значком на экране iPhone. Пробел — «широкий» (&ensp;): обычный iPhone сжимает,
       и выходило «КЛЮШКИRUSSIA» (скрин владельца 2026-11-19) -->
  <meta name="apple-mobile-web-app-title" content="КЛЮШКИ&ensp;RUSSIA">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="КЛЮШКИ RUSSIA">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Каталог — КЛЮШКИ RUSSIA">
  <meta property="og:description" content="Хоккейные клюшки и экипировка в наличии. Подбор клюшки по росту и весу, заказ — в Telegram, доставка по России.">
  <meta property="og:image" content="https://zzzx07180-cyber.github.io/klushki-russia/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Логотип КЛЮШКИ RUSSIA и хоккейная шайба">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Шрифты лежат на нашем сайте в папке fonts/ (лицензия SIL Open Font License), подключены в style.css.
       Кириллицу всех трёх просим загрузить сразу — она нужна на первом экране. -->
  <link rel="preload" href="fonts/roboto-condensed-italic-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/oswald-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=20261119-1106">
</head>
<body>
  <canvas id="ice" class="ice-bg" aria-hidden="true"></canvas>

  <!-- ШАПКА (такая же, как на главной) -->
  <header class="header">
    <div class="header__inner">
      <button class="burger" id="burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
        <span></span><span></span><span></span>
      </button>

      <nav class="nav" id="nav">
        <a href="catalog.html" aria-current="page">Каталог</a>
        <a href="index.html#how">Как заказать</a>
        <a href="index.html#delivery">Доставка</a>
        <a href="index.html#contacts">Контакты</a>
      </nav>

      <a href="index.html" class="logo" aria-label="КЛЮШКИ RUSSIA — на главную">
        КЛЮШКИ <span class="logo__tag">RUSSIA</span>
      </a>

      <div class="header__right">
        <!-- Корзина: число товаров и выдвижное окно — в cart.js -->
        <button class="cart-btn" id="cartBtn" type="button" data-cart-open aria-label="Корзина">
          <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h3.4l3 13.2h12.6l2.6-9.4H6.8"/><circle cx="11" cy="22.6" r="1.7"/><circle cx="20" cy="22.6" r="1.7"/></svg>
          <span class="cart-btn__count" id="cartCount" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="section catalog-page">
    <div class="container">
      <p class="crumbs"><a href="index.html">Главная</a> / Каталог</p>
      <h1 class="section__title">Каталог</h1>

      <!-- КАТАЛОГ: фильтры и товары рисует catalog.js (тот же блок стоит на главной).
           data-sync-url — выбранные фильтры записываются в адрес страницы. -->
      <div id="catalogApp" data-sync-url></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© 2026 КЛЮШКИ RUSSIA</span>
      <span>Доставка СДЭК и Почтой России</span>
    </div>
  </footer>

  <!-- Плавающая кнопка «Подобрать клюшку»: открывает помощника по подбору (picker.js) -->
  <button type="button" class="float-chat" data-picker-open aria-haspopup="dialog" aria-label="Подобрать клюшку">
    <span class="float-chat__label">Подобрать клюшку</span>
    <span class="float-chat__btn" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8.5 10c0-1.95 3-3.5 6.75-3.5S22 8.05 22 10v3.9c0 1.95-3 3.5-6.75 3.5S8.5 15.85 8.5 13.9z"/><path fill="none" style="stroke:var(--accent)" stroke-width="1.3" d="M8.7 10.45c.65 1.6 3.4 2.85 6.55 2.85s5.9-1.25 6.55-2.85"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3.2 8.8h3.2M1.6 12.1h4.8M3.2 15.4h3.2"/></svg>
    </span>
  </button>

  <!-- Всплывающая подсказка (например, «Текст скопирован») -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="ice.js?v=20261119-1106"></script>
  <script src="script.js?v=20261119-1106"></script>
  <script src="data/products.js?v=20261119-1106"></script>
  <script src="shop.js?v=20261119-1106"></script>
  <script src="delivery.js?v=20261119-1106"></script>
  <script src="cart.js?v=20261119-1106"></script>
  <script src="picker.js?v=20261119-1106"></script>
  <script src="catalog.js?v=20261119-1106"></script>
</body>
</html>
